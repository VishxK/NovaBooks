<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | Nova Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { dark: '#0F172A', accent: '#D97706', light: '#F8FAFC' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

<header class="bg-brand-dark text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="shop.html" class="flex items-center gap-2 text-2xl font-serif font-bold text-white">
            <i class="fa-solid fa-book-open text-brand-accent"></i> Nova Books
        </a>
        <div class="flex items-center gap-4">
            <a href="shop.html" class="text-sm font-semibold text-slate-300 hover:text-white transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Catalog
            </a>
            <a href="checkout.html" class="bg-brand-accent text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-yellow-600 transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-cart-shopping"></i> Checkout
            </a>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
    <div id="productContainer" class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-8 md:p-12">

        <div class="animate-pulse flex flex-col md:flex-row gap-8">
            <div class="w-full md:w-1/3 h-96 bg-slate-200 rounded-2xl"></div>
            <div class="w-full md:w-2/3 space-y-4">
                <div class="h-8 bg-slate-200 rounded w-3/4"></div>
                <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                <div class="h-20 bg-slate-200 rounded w-full"></div>
            </div>
        </div>
    </div>
</main>

<div id="footerContainer"></div>


<script>
    let currentBook = null;

    document.addEventListener('DOMContentLoaded', loadProductDetails);

    async function loadProductDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');

        if (!bookId) {
            window.location.href = 'shop.html';
            return;
        }

        try {
            const response = await fetch(`api/books/${bookId}`);
            if (!response.ok) throw new Error("Book not found");

            currentBook = await response.json();
            renderProductPage(currentBook);
        } catch (err) {
            document.getElementById('productContainer').innerHTML = `
                <div class="text-center py-12">
                    <i class="fa-solid fa-circle-exclamation text-4xl text-amber-500 mb-3"></i>
                    <h3 class="text-xl font-bold text-slate-700">Book Details Not Found</h3>
                    <p class="text-slate-500 text-sm mt-1 mb-6">The requested book does not exist or has been removed.</p>
                    <a href="shop.html" class="bg-brand-dark text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-brand-accent transition">
                        Back to Catalog
                    </a>
                </div>`;
        }
    }

    function renderProductPage(book) {
        const price = book.price ? Number(book.price).toFixed(2) : '0.00';
        const cover = (book.imagePath && book.imagePath.trim() !== '')
            ? book.imagePath
            : 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400';

        document.getElementById('productContainer').innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-start">

                <!-- Cover Image -->
                <div class="bg-slate-100 rounded-2xl overflow-hidden shadow-md max-h-[480px]">
                    <img src="${cover}"
                         onerror="this.src='https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400'"
                         class="w-full h-full object-cover">
                </div>

                <!-- Book Information -->
                <div class="flex flex-col h-full">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold uppercase tracking-widest text-brand-accent bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                            In Stock (${book.quantity || 10} copies available)
                        </span>
                    </div>

                    <h1 class="font-serif text-3xl md:text-4xl font-bold text-brand-dark mb-2">${book.title}</h1>
                    <p class="text-slate-500 font-medium text-base mb-6">By <span class="text-slate-800 font-semibold">${book.author || 'Unknown Author'}</span></p>

                    <div class="text-3xl font-bold text-brand-dark mb-6">
                        Rs. ${price}
                    </div>

                    <p class="text-slate-600 leading-relaxed mb-8">
                        ${book.description || 'No detailed description available for this publication. Add this title to your personal collection today.'}
                    </p>

                    <div class="quantity-selector mb-6">
                        <label for="productQuantity" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Quantity:</label>
                        <div class="flex items-center gap-2 max-w-[140px]">
                            <button onclick="adjustQuantity(-1)" type="button" class="w-10 h-10 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 font-bold hover:bg-slate-200 transition flex items-center justify-center">-</button>
                            <input type="number" id="productQuantity" class="w-12 text-center font-bold text-slate-800 bg-transparent outline-none" value="1" min="1" readonly>
                            <button onclick="adjustQuantity(1)" type="button" class="w-10 h-10 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 font-bold hover:bg-slate-200 transition flex items-center justify-center">+</button>
                        </div>
                    </div>

                    <div class="flex gap-4 mt-auto">
                        <button onclick="handleAddToCart()"
                                class="flex-1 bg-brand-dark hover:bg-brand-accent text-white py-4 rounded-xl font-semibold transition flex items-center justify-center gap-2 shadow-lg">
                            <i class="fa-solid fa-cart-plus"></i> Add to Cart
                        </button>
                        <a href="checkout.html"
                           class="flex-1 bg-brand-accent hover:bg-yellow-600 text-white py-4 rounded-xl font-semibold transition flex items-center justify-center gap-2 shadow-lg">
                            <i class="fa-solid fa-bag-shopping"></i> View Cart / Checkout
                        </a>
                    </div>
                </div>

            </div>
        `;
    }

    function adjustQuantity(amount) {
        const qtyInput = document.getElementById('productQuantity');
        if (!qtyInput) return;
        let currentQty = parseInt(qtyInput.value) || 1;
        currentQty += amount;

        if (currentQty < 1) currentQty = 1;
        qtyInput.value = currentQty;
    }

    function handleAddToCart() {
        if (!currentBook) {
            alert("Product data is still loading. Please wait a moment.");
            return;
        }

        const qtyInput = document.getElementById('productQuantity');
        const selectedQuantity = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;

        let cart = JSON.parse(localStorage.getItem('nova_cart')) || [];
        const itemId = String(currentBook.id || currentBook.bookId);

        const cover = (currentBook.imagePath && currentBook.imagePath.trim() !== '')
            ? currentBook.imagePath
            : 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400';

        const price = Number(currentBook.price) || 0;

        const existing = cart.find(item => String(item.book_id || item.id) === itemId);

        if (existing) {
            existing.quantity += selectedQuantity;
        } else {
            cart.push({
                book_id: itemId,
                id: itemId,
                title: currentBook.title || 'Untitled',
                price: price,
                image: cover,
                quantity: selectedQuantity
            });
        }

        localStorage.setItem('nova_cart', JSON.stringify(cart));

        showToast(`Added ${selectedQuantity} copy(ies) of "${currentBook.title}" to your cart!`);
    }

    function showToast(message) {
        let container = document.getElementById('toastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'fixed top-20 right-6 z-50 flex flex-col gap-2 pointer-events-none';
            document.body.appendChild(container);
        }

        const toast = document.createElement('div');
        toast.className = `pointer-events-auto flex items-center gap-3 bg-brand-dark text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700/80 transition-all duration-300 transform -translate-y-5 opacity-0`;

        toast.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-brand-accent shrink-0">
            <i class="fa-solid fa-check text-sm"></i>
        </div>
        <div>
            <h5 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Cart Updated</h5>
            <p class="text-xs font-semibold text-slate-100">${message}</p>
        </div>
    `;

        container.appendChild(toast);

        requestAnimationFrame(() => {
            toast.classList.remove('-translate-y-5', 'opacity-0');
        });

        setTimeout(() => {
            toast.classList.add('-translate-y-5', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch("footer.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("footerContainer").innerHTML = data;
            })
            .catch(err => console.error("Error loading footer:", err));
    });
</script>
</body>
</html>
