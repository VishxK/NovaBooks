<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nova Books</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            accent: '#d97706',
                            light: '#f8fafc',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light font-sans text-slate-800 antialiased h-screen flex overflow-hidden">

<div class="hidden lg:flex w-1/2 relative bg-brand-dark items-center justify-center">
    <div class="absolute inset-0 bg-gradient-to-t from-brand-dark via-brand-dark/40 to-transparent z-10"></div>
    <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=1000"
         alt="Library Books"
         class="absolute inset-0 w-full h-full object-cover opacity-60">

    <div class="relative z-20 text-center px-12">
        <i class="fa-solid fa-book-open text-brand-accent text-5xl mb-6"></i>
        <h1 class="text-5xl font-serif font-bold text-white mb-4 leading-tight">Welcome back to<br>Nova Books.</h1>
        <p class="text-slate-300 text-lg max-w-md mx-auto">Log in to pick up right where you left off. Your next great adventure awaits.</p>
    </div>
</div>

<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 md:p-24 overflow-y-auto bg-white">
    <div class="w-full max-w-md">

        <!-- Mobile Logo (Shows only on small screens) -->
        <div class="lg:hidden flex items-center gap-2 mb-10">
            <i class="fa-solid fa-book-open text-brand-accent text-3xl"></i>
            <span class="font-serif font-bold text-3xl tracking-tight text-brand-dark">Nova<span class="text-brand-accent">Books</span></span>
        </div>

        <h2 class="text-3xl font-serif font-bold text-brand-dark mb-2">Sign In</h2>
        <p class="text-slate-500 mb-8">Enter your details below to access your account.</p>

        <div id="alertBox" class="hidden p-4 mb-6 rounded-lg text-sm border font-medium flex items-center gap-3"></div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-slate-400"></i>
                    </div>
                    <input type="email" id="email" required
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-accent/20 focus:border-brand-accent outline-none transition-all">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-sm font-medium text-slate-700">Password</label>
                    <a href="#" class="text-xs font-semibold text-brand-accent hover:text-yellow-600 transition">Forgot password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-400"></i>
                    </div>
                    <input type="password" id="password" required
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-accent/20 focus:border-brand-accent outline-none transition-all">
                </div>
            </div>

            <div class="flex items-center justify-between my-4">
                <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-600">
                    <input type="checkbox" id="chkRememberMe" class="rounded border-slate-300 text-brand-accent focus:ring-brand-accent">
                    <span>Remember Me</span>
                </label>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full bg-brand-dark text-white font-semibold py-3.5 rounded-xl hover:bg-slate-800 transition duration-300 shadow-lg shadow-brand-dark/20 mt-4 flex justify-center items-center gap-2 group">
                <span id="btnText">Sign In</span>
                <i  id="btnIcon" class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>

        <p class="text-center text-slate-500 mt-10">
            Don't have an account?
            <a href="register.html" class="text-brand-dark font-bold hover:text-brand-accent transition">Create one</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        const payload = {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            rememberMe: document.getElementById('chkRememberMe').checked
        };

        // UI Loading State Enable කිරීම
        submitBtn.disabled = true;
        btnText.textContent = 'Signing in...';
        btnIcon.className = 'fa-solid fa-spinner fa-spin';

        try {
            const response = await fetch('api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            console.log("Backend Response:", result);


            const isSuccess = result.status === true ||
                result.status === 'success' ||
                result.success === true ||
                (response.ok && !result.error);

            if (isSuccess) {
                const user = result.user || result;

                if (user) {
                    localStorage.setItem('nova_user', JSON.stringify({
                        id: user.id || '',
                        firstName: user.firstName || '',
                        lastName: user.lastName || '',
                        email: user.email || payload.email,
                        address: user.address || '',
                        role: user.role || 'USER'
                    }));
                }

                alertBox.className = 'p-4 mb-6 rounded-lg text-sm border font-medium flex items-center gap-3 bg-emerald-50 border-emerald-200 text-emerald-700';
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-lg"></i> <span>Login successful! Redirecting...</span>`;

                setTimeout(() => {
                    if (result.isAdmin) {
                        window.location.href = "admin-dashboard.html";
                    }else {
                        window.location.href = 'shop.html';
                    }
                }, 1000);

            } else {
                alertBox.className = 'p-4 mb-6 rounded-lg text-sm border font-medium flex items-center gap-3 bg-red-50 border-red-200 text-red-700';
                alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation text-lg"></i> <span>${result.message || 'Invalid email or password.'}</span>`;

                // Reset Button
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
                btnIcon.className = 'fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform';
            }

        } catch (err) {
            console.error("Login Error:", err);
            alertBox.className = 'p-4 mb-6 rounded-lg text-sm border font-medium flex items-center gap-3 bg-red-50 border-red-200 text-red-700';
            alertBox.innerHTML = `<i class="fa-solid fa-wifi text-lg"></i> <span>Server connection failed or response error.</span>`;

            submitBtn.disabled = false;
            btnText.textContent = 'Sign In';
            btnIcon.className = 'fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform';
        }
    });
</script>
</body>
</html>
