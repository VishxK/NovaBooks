<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | NovaBooks</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            padding: 3rem;
            max-width: 550px;
            width: 90%;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .brand-logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: #0f172a;
            text-decoration: none;
            margin-bottom: 1.5rem;
            display: inline-block;
        }
        .brand-logo span {
            color: #dc2626;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #dc2626;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .icon-box {
            width: 90px;
            height: 90px;
            background: #fef2f2;
            color: #dc2626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }
        .btn-primary-custom {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1.75rem;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary-custom:hover {
            background-color: #1e293b;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
        }
        .btn-secondary-custom {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            padding: 0.75rem 1.75rem;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        .btn-secondary-custom:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }
    </style>
</head>
<body>

<div class="error-card">
    <a href="shop.html" class="brand-logo">
        <i class="fa-solid fa-book-open me-2 text-danger"></i>Nova<span>Books</span>
    </a>

    <div class="icon-box">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <div class="error-code">500</div>
    <h3 class="fw-bold mb-2">Internal Server Error</h3>
    <p class="text-muted mb-4">
        Something went wrong on our end. Our technical team has been notified, and we are working to fix it.
    </p>

    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
        <button onclick="location.reload()" class="btn-secondary-custom">
            <i class="fa-solid fa-rotate-right me-1"></i> Try Again
        </button>
        <a href="shop.html" class="btn-primary-custom">
            <i class="fa-solid fa-house"></i> Back to Home
        </a>
    </div>
</div>

</body>
</html>
